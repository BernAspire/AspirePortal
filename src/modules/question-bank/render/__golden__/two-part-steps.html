<div class="qb-blocks flex flex-col gap-2 text-[17px] leading-relaxed">
<p>(a) Write six million and forty-one in numerals. (b) What is 162 000 ÷ 400?</p>
</div>
<ol class="qb-steps flex list-none flex-col gap-1 text-[15px] tabular-nums">
<li class="mt-1.5 font-semibold">(a) Millions: 6, Thousands: 0, Ones: 041 → 6 000 041</li>
<li class="mt-1.5 font-semibold">(b) 162 000 ÷ 100 = 1620</li>
<li>1620 ÷ 4 = 405</li>
</ol>
