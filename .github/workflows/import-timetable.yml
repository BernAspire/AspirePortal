name: Import timetable

# Imports the timetable spreadsheets waiting in the Supabase `timetable-inbox` bucket:
# classes, student lists, one-off sessions, cancellations and attendance.
# Run it from GitHub: Actions → Import timetable → Run workflow.
# Template: docs/templates/timetable-template.xlsx. Steps: docs/runbooks/import-timetable.md.
#
# Needs repository secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
# The service-role key is used only by this job (CLAUDE.md rule 5).

on:
  workflow_dispatch:
    inputs:
      centre:
        description: "Centre slug (as in the centres table), e.g. aspire-hub"
        required: true
        type: string

concurrency:
  group: import-timetable
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing secrets::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install spreadsheet reader
        run: pip install --quiet "openpyxl==3.1.5"

      - name: Test importer rules
        working-directory: scripts/timetable_import
        run: python3 -m unittest -q

      - name: Import
        working-directory: scripts/timetable_import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENTRE: ${{ inputs.centre }}
        run: python3 import_timetable.py inbox --centre "$CENTRE"
