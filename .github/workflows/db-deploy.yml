name: Deploy database migrations

# Applies new files in supabase/migrations to the linked Supabase project when they reach
# main. Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    - the project's reference id (Project Settings > General)
#   SUPABASE_DB_PASSWORD   - the database password chosen when the project was created
# The job is skipped until SUPABASE_PROJECT_ID is set.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "SUPABASE_PROJECT_ID secret not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -o pipefail
          report() {
            # Surface the last lines as an annotation so the failure is readable without the raw log.
            tail -n 15 "$1" | sed -e 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g' | xargs -0 -I{} echo "::error title=$2::{}"
          }
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID" > link.log 2>&1; then
            cat link.log; report link.log "supabase link failed"; exit 1
          fi
          tail -n 15 link.log | sed -e 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g' | xargs -0 -I{} echo "::notice title=supabase link output::{}"
          if ! supabase db push --linked --include-all > push.log 2>&1 < /dev/null; then
            cat push.log; report push.log "supabase db push failed"; exit 1
          fi
          cat push.log
