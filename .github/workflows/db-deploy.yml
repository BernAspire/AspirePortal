name: Deploy database migrations

# Applies new files in supabase/migrations to the Supabase project when they reach main.
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_PROJECT_ID    - the project's reference id (Project Settings > General)
#   SUPABASE_DB_PASSWORD   - the database password (Database > Settings > Reset database password)
#   SUPABASE_ACCESS_TOKEN  - personal access token (kept for future CLI steps; not needed to push)
# Optional repository variable SUPABASE_REGION (default ap-southeast-1, Singapore).
#
# GitHub runners have no IPv6, and Supabase's direct database host is IPv6-only, so the push
# goes through the IPv4 session pooler (Supavisor) on port 5432.
# The job is skipped until SUPABASE_PROJECT_ID is set.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'ap-southeast-1' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_PROJECT_ID or SUPABASE_DB_PASSWORD not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Push migrations through the session pooler
        if: steps.cfg.outputs.ready == 'true'
        run: |
          report() {
            # Surface the last lines as an annotation so the failure is readable without the raw log.
            tail -n 15 "$1" | sed -e 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g' | xargs -0 -I{} echo "::$3 title=$2::{}"
          }
          ENC_PW="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "::add-mask::$ENC_PW"
          ok=false
          for host in "aws-0-${SUPABASE_REGION}.pooler.supabase.com" "aws-1-${SUPABASE_REGION}.pooler.supabase.com"; do
            url="postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENC_PW}@${host}:5432/postgres"
            if supabase db push --db-url "$url" --include-all > push.log 2>&1 < /dev/null; then
              ok=true
              report push.log "Migrations applied via ${host}" notice
              break
            fi
            report push.log "Push via ${host} failed" warning
          done
          if [ "$ok" != true ]; then
            echo "::error title=supabase db push failed::Could not apply migrations through either pooler host. See the warnings above."
            exit 1
          fi
